용어 제한: 분석 내용에 MBTI나 에니어그램이라는 단어나 기호를 직접적으로 노출하지 마십시오. 오직 그 이론이 뜻하는 심리적 역동과 행동 패턴만을 일상적이고 전문적인 언어로 녹여내십시오.

- 트라우마와 현재 행동의 연결: 과거의 상실이나 아픔이 현재의 예민함, 통제 욕구, 혹은 대인관계 지연 행동으로 어떻게 이어지고 있는지 무의식적 연결 고리를 짚어내십시오.

3. SWOT 심리 및 역량 진단
표면적 스킬이 아닌, 파악된 심리적 자본과 내면의 취약성을 중심으로 강점(S), 약점(W), 기회(O), 위협(T)을 표 형태로 진단하십시오. 막연한 긍정의 단어 대신, 실제 자활 현장에서 발현될 수 있는 구체적인 요소를 작성하십시오.

function renderMarkdown(md) {
  if (!md) return "";
  return md
    .replace(/^### (.+)$/gm, '<h3 class="md-h3">$1</h3>')
    .replace(/^## (.+)$/gm, '<h2 class="md-h2">$1</h2>')
    .replace(/^# (.+)$/gm, '<h1 class="md-h1">$1</h1>')
    .replace(/^> (.+)$/gm, '<blockquote class="md-q">$1</blockquote>')
    .replace(/^- \[( |x)\] (.+)$/gm, (_, c, t) => `<div class="md-li"><span class="md-ck">${c === 'x' ? '☑' : '☐'}</span><span>${t}</span></div>`)
    .replace(/^- (.+)$/gm, '<div class="md-li"><span class="md-dot">●</span><span>$1</span></div>')
    .replace(/^---$/gm, '<hr style="margin:16px 0;border:none;border-top:1px solid var(--border)" />')
    .replace(/\n{2,}/g, '<div style="height:10px"></div>')
    .replace(/\n/g, "<br/>");
}

function Button({ variant = "primary", color, icon, children, full, size = "md", ...rest }) {
  const pad = size === "sm" ? "8px 14px" : "12px 18px";
  const fs = size === "sm" ? 12 : 14;
  const base = {
    display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8,
    fontFamily: "inherit", fontSize: fs, fontWeight: 600, borderRadius: 13,
    padding: pad, border: "none", cursor: rest.disabled ? "not-allowed" : "pointer",
    width: full ? "100%" : "auto", opacity: rest.disabled ? 0.55 : 1,
    transition: "all var(--dur) var(--ease)",
  };
  const styles = {
    primary: { background: "var(--accent)", color: "#fff" },
    program: { background: color, color: "#fff" },
    ghost:   { background: "var(--surface-hover)", color: "var(--text-secondary)", border: "1px solid var(--border)" },
    soft:    { background: "var(--accent-soft)", color: "var(--accent)", border: "1px solid var(--accent-border)" },
  };
  const [hov, setHov] = useState(false);
  const hovStyle = !rest.disabled && hov && (variant === "primary" || variant === "program") ? { opacity: 0.88 }
                 : !rest.disabled && hov && variant === "ghost" ? { background: "var(--surface-active)" } : {};
  return (
    <button {...rest} style={{ ...base, ...styles[variant], ...hovStyle, ...(rest.style || {}) }}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}>
      {icon}{children}
    </button>
  );
}

function Badge({ tone = "neutral", color, children }) {
  const map = {
    neutral: { background: "var(--surface-active)", color: "var(--text-secondary)" },
    accent:  { background: "rgba(78,122,199,.12)", color: "var(--accent)" },
    oneul:   { background: "rgba(123,102,214,.1)", color: "var(--oneul)" },
    naeiro:  { background: "rgba(46,158,120,.1)", color: "var(--naeiro)" },
    warning: { background: "rgba(200,137,58,.12)", color: "var(--warning)" },
    error:   { background: "rgba(214,106,92,.1)", color: "var(--error)" },
  };
  const s = color ? { background: color + "1A", color } : map[tone];
  return <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 10, fontWeight: 600, padding: "3px 10px", borderRadius: 999, ...s }}>{children}</span>;
}

          <p style={{ marginTop: 8, fontSize: 13, color: "var(--muted)" }}>충북청주지역자활센터 AI 참여자 분석 시스템</p>
        </div>
        <div style={{ borderRadius: 22, padding: 26, background: "var(--surface)", border: "1px solid var(--border)", boxShadow: "var(--shadow-card)" }}>
          <p style={{ fontSize: 13, marginBottom: 18, textAlign: "center", color: "var(--text-secondary)" }}>센터 직원 계정으로 로그인해 주세요</p>
          <button onClick={handleGoogleLogin} disabled={loading}
            style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 12, padding: "12px 16px", borderRadius: 16, fontSize: 14, fontWeight: 500, fontFamily: "inherit", cursor: loading ? "default" : "pointer",
              background: "var(--surface)", color: loading ? "var(--muted)" : "#3c4043", border: "1px solid var(--border)", boxShadow: loading ? "none" : "var(--shadow-card)", transition: "all var(--dur) var(--ease)" }}>
            {loading ? <I.Spinner size={20} /> : <I.Google size={20} />}
            {loading ? "로그인 중..." : "Google 계정으로 로그인"}
          </button>
        </div>
        <p style={{ textAlign: "center", marginTop: 22, fontSize: 11, color: "var(--muted)" }}>{CONFIG.APP_VERSION} · 허가된 직원만 접근 가능합니다</p>
      </div>
    </div>
  );
}

function DashboardScreen({ responses }) {
  // 전체 참여자 수와 사업단 분포는 실제 응답 데이터에서 집계
  const total = responses.length;
  const orgMap = {};
  responses.forEach(r => { orgMap[r.org] = (orgMap[r.org] || 0) + 1; });
  const orgs = Object.entries(orgMap).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
  const orgMax = Math.max(1, ...orgs.map(o => o.count));
  const quarter = responses[0]?.timestamp ? responses[0].timestamp.slice(0, 7) : "";

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div>
        <h2 style={{ fontSize: 18, fontWeight: 700, color: "var(--heading)" }}>센터 현황</h2>
        <p style={{ fontSize: 12, color: "var(--muted)", marginTop: 2 }}>{quarter ? quarter + " · " : ""}참여자 분석 개요</p>
      </div>

      <div style={{ display: "flex", gap: 10 }}>
        <StatCard label="전체 참여자" value={total} sub="명" />
        <StatCard label="사업단 수" value={orgs.length} sub="개" accent="var(--accent)" />
      </div>

      <SectionCard title="사업단별 참여 현황">
        {orgs.length === 0 ? (
          <p style={{ fontSize: 12, color: "var(--muted)" }}>표시할 응답이 없습니다.</p>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 11 }}>
            {orgs.map(o => (
              <div key={o.name} style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <span style={{ flex: "0 0 96px", fontSize: 12, color: "var(--text-secondary)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{o.name}</span>
                <div style={{ flex: 1, height: 10, borderRadius: 999, background: "var(--surface-active)", overflow: "hidden" }}>
                  <div style={{ height: "100%", width: `${(o.count / orgMax) * 100}%`, borderRadius: 999, background: "var(--accent)", opacity: 0.85 }} />
                </div>
                <span style={{ width: 26, textAlign: "right", fontSize: 12, fontWeight: 600, color: "var(--text)" }}>{o.count}</span>
              </div>
            ))}
          </div>
        )}
      </SectionCard>

      <SectionCard title="최근 응답">
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {responses.slice(0, 5).map((r, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <span style={{ width: 8, height: 8, borderRadius: 999, background: "var(--accent)" }} />
              <span style={{ fontSize: 13, fontWeight: 500, color: "var(--text)" }}>{r.code}</span>
              <span style={{ fontSize: 11, color: "var(--muted)" }}>{r.org}</span>
              <span style={{ marginLeft: "auto", fontSize: 11, color: "var(--muted)" }}>{r.timestamp.split(" ")[0]}</span>
            </div>
          ))}
        </div>
      </SectionCard>
    </div>
  );
}

// ── 다운로드 센터 (GAS 서식 생성 + Word) ──
function DownloadCenter({ response, oneulResult, naeirResult, selectedPath, gasUrl, downloadAsWord }) {
  const [generating, setGenerating] = useState(null);
  const [statusMsg, setStatusMsg] = useState("");
  const [hover, setHover] = useState(null);

  const generateFromTemplate = async (type) => {
    if (type === "interview") {
      setStatusMsg("면접지 생성 중...");
      const genRes = await fetch(gasUrl, {
        method: "POST", redirect: "follow",
        body: JSON.stringify({ action: "generateInterview", data: { counselor: "" }, participant: { code: response.code, org: response.org } }),
      });
      const genData = await genRes.json();
      if (!genData.success) throw new Error(genData.error || "면접지 생성 실패");
      return genData;
    }
    setStatusMsg(type === "iap" ? "IAP 데이터 추출 중..." : "ISP 데이터 추출 중...");
    const extractAction = type === "iap" ? "extractForIAP" : "extractForISP";
    const extractRes = await fetch(gasUrl, {
      method: "POST", redirect: "follow",
      body: JSON.stringify({ action: extractAction, oneulResult, naeirResult, selectedPath: selectedPath || "" }),
    });
    const extractData = await extractRes.json();
    if (!extractData.success) throw new Error(extractData.error || "데이터 추출 실패");
    setStatusMsg(type === "iap" ? "IAP 서식 생성 중..." : "ISP 서식 생성 중...");
    const generateAction = type === "iap" ? "generateIAP" : "generateISP";
    const genRes = await fetch(gasUrl, {
      method: "POST", redirect: "follow",
      body: JSON.stringify({ action: generateAction, data: extractData.data, participant: { code: response.code, org: response.org } }),
    });
    const genData = await genRes.json();
    if (!genData.success) throw new Error(genData.error || "서식 생성 실패");
    return genData;
  };

  const downloadIntegrated = () => {
    const report = `# 프로젝트 내일로 종합 분석 리포트\n\n참여자: ${response.code}\n소속: ${response.org}\n분석일: ${new Date().toLocaleDateString("ko-KR")}\n선택 경로: ${selectedPath || "미선택"}\n\n---\n\n## Part 1. 심층 DNA 분석 (오늘은)\n\n${oneulResult}\n\n---\n\n## Part 2. 실행 계획 설계 (내일로)\n\n${naeirResult}\n\n---\n\n> 본 리포트는 2개의 독립적인 AI 분석 프롬프트를 통해 생성되었습니다.\n> 충북청주지역자활센터 프로젝트 내일로 ${CONFIG.APP_VERSION}`;
    downloadAsWord(report, `내일로_종합리포트_${response.code}`);
  };

  const downloadItem = async (type) => {
    if (type === "word") { downloadIntegrated(); return; }
    if (!gasUrl) { alert("GAS 프록시 URL이 설정되지 않아 서식을 생성할 수 없습니다. 설정(⚙)에서 URL을 입력해 주세요."); return; }
    setGenerating(type);
    setStatusMsg("");
    try {
      const result = await generateFromTemplate(type);
      setStatusMsg("다운로드 준비 완료!");
      window.open(result.fileUrl, "_blank");
    } catch (err) {
      alert((type === "iap" ? "IAP" : type === "isp" ? "ISP" : "면접지") + " 생성 오류: " + err.message);
    }
    setGenerating(null);
    setStatusMsg("");
  };

  const downloadAll = async () => {
    setGenerating("all");
    try {
      if (gasUrl) { await downloadItem("iap"); await downloadItem("isp"); await downloadItem("interview"); }
      downloadIntegrated();
    } catch (err) {
      alert("일괄 다운로드 중 오류: " + err.message);
    }
    setGenerating(null);
  };

  const items = [
    { id: "iap", icon: "📋", label: "IAP 서식", desc: "자립경로 (약점/강점, 단·중·장기 목표, 자활경로)", ext: ".xlsx" },
    { id: "isp", icon: "📊", label: "ISP 서식", desc: "자활지원계획 (욕구영역, 합의 목표, 실행과제)", ext: ".xlsx" },
    { id: "interview", icon: "📄", label: "기본면접지", desc: "참여자 기본면접기록지 (상담일자 자동 입력)", ext: ".xlsx" },
    { id: "word", icon: "📝", label: "종합 리포트", desc: "오늘은 + 내일로 전체 분석 결과", ext: ".doc" },
  ];

  return (
    <div style={{ borderRadius: 16, overflow: "hidden", marginBottom: 12, background: "var(--surface)", border: "1px solid var(--border)", boxShadow: "var(--shadow-card)" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", background: "var(--accent-soft)", borderBottom: "1px solid var(--border)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, color: "var(--accent)" }}><I.Download size={18} /><span style={{ fontSize: 12, fontWeight: 700 }}>다운로드 센터</span></div>
        <button onClick={downloadAll} disabled={!!generating}
          style={{ fontSize: 10, padding: "5px 12px", borderRadius: 999, border: "none", cursor: generating ? "default" : "pointer", fontWeight: 600, fontFamily: "inherit",
            background: generating ? "var(--surface-active)" : "var(--accent)", color: generating ? "var(--muted)" : "#fff" }}>
          {generating === "all" ? "생성 중..." : "전체 다운로드"}
        </button>
      </div>
      {statusMsg && (
        <div style={{ padding: "8px 16px", display: "flex", alignItems: "center", gap: 8, background: "var(--surface-active)" }}>
          <span style={{ color: "var(--accent)" }}><I.Spinner size={14} /></span>
          <span style={{ fontSize: 10, color: "var(--accent)" }}>{statusMsg}</span>
        </div>
      )}
      <div>
        {items.map((it, i) => (
          <button key={it.id} onClick={() => downloadItem(it.id)} disabled={!!generating}
            onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}
            style={{ width: "100%", textAlign: "left", padding: "13px 16px", display: "flex", alignItems: "center", gap: 12, cursor: generating ? "default" : "pointer", fontFamily: "inherit",
              opacity: generating && generating !== it.id && generating !== "all" ? 0.5 : 1,
              background: hover === i && !generating ? "var(--surface-hover)" : "transparent", border: "none", borderBottom: i < items.length - 1 ? "1px solid var(--border-light)" : "none" }}>
            <span style={{ fontSize: 18 }}>{it.icon}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 12, fontWeight: 600, color: "var(--text)", whiteSpace: "nowrap" }}>{it.label}</span>
                <span style={{ fontSize: 10, padding: "2px 6px", borderRadius: 4, background: "var(--surface-active)", color: "var(--muted)" }}>{it.ext}</span>
              </div>
              <p style={{ fontSize: 10, marginTop: 2, color: "var(--muted)" }}>{it.desc}</p>
            </div>
            <span style={{ color: "var(--muted)" }}>{(generating === it.id || generating === "all") ? <I.Spinner size={14} /> : <I.ChevronRight size={16} />}</span>
          </button>
        ))}
      </div>
      <div style={{ padding: "8px 16px", background: "var(--bg)", borderTop: "1px solid var(--border-light)" }}>
        <p style={{ fontSize: 10, color: "var(--muted)" }}>원본 서식이 100% 유지됩니다. AI가 분석 결과를 해당 셀에 자동 입력합니다. 다운로드 후 참여자 인적사항을 보완해 주세요.</p>
      </div>
    </div>
  );
}

// ── 개별 분석 카드 ──
function AnalysisCard({ label, subtitle, color, colorSoft, result, state, progress, errorMsg, desc, context, showNote, note, setNote, files, setFiles, onRun, onReset, onDownload }) {
  const [noteTab, setNoteTab] = useState("text");
  const fmtSize = (b) => b < 1024 ? b + "B" : b < 1048576 ? (b / 1024).toFixed(0) + "KB" : (b / 1048576).toFixed(1) + "MB";
  const addFiles = (e) => {
    const picked = [...e.target.files].map(f => ({ name: f.name, size: f.size }));
    setFiles([...(files || []), ...picked]);
    e.target.value = "";
  };
  return (
    <div style={{ borderRadius: 16, overflow: "hidden", background: "var(--surface)", boxShadow: "var(--shadow-card)", border: `1px solid ${state === "done" ? color + "44" : "var(--border)"}` }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", background: colorSoft, borderBottom: "1px solid var(--border)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ width: 10, height: 10, borderRadius: 999, background: color }} />
          <span style={{ fontSize: 12, fontWeight: 700, color }}>{label}</span>
          <span style={{ fontSize: 10, color: "var(--muted)" }}>{subtitle}</span>
        </div>
        {state === "done" && <span style={{ fontSize: 10, padding: "2px 10px", borderRadius: 999, background: color + "1A", color }}>완료</span>}
      </div>

      {context && (
        <div style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "10px 16px", background: color + "0D", borderBottom: "1px solid var(--border-light)" }}>
          <span style={{ color, marginTop: 1, flex: "0 0 auto" }}><I.Route size={14} /></span>
          <div style={{ minWidth: 0 }}>
            <span style={{ fontSize: 10, fontWeight: 700, color }}>확정 자활 경로</span>
            <p style={{ fontSize: 12, fontWeight: 500, color: "var(--text)", marginTop: 1 }}>{context}</p>
          </div>
        </div>
      )}

      {state === "idle" && (
        <div style={{ padding: 16 }}>
          <p style={{ fontSize: 12, marginBottom: 12, color: "var(--text-secondary)", lineHeight: 1.6 }}>{desc}</p>
          <Button variant="program" color={color} full icon={<I.Analysis size={18} />} onClick={onRun}>{label} 분석 시작</Button>
        </div>
      )}

      {state === "analyzing" && (
        <div style={{ padding: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, color }}>
            <I.Spinner size={18} /><span style={{ fontSize: 12, fontWeight: 500, color: "var(--text)" }}>AI 분석 진행 중...</span>
          </div>
          <ProgressBar label={label} progress={progress} color={color} />
          <p style={{ fontSize: 10, color: "var(--muted)" }}>약 30초~1분 소요됩니다</p>
        </div>
      )}

      {state === "error" && (
        <div style={{ padding: 16 }}>
          <div style={{ borderRadius: 11, padding: 12, marginBottom: 12, background: "rgba(214,106,92,.08)", border: "1px solid rgba(214,106,92,.2)" }}>
            <p style={{ fontSize: 12, fontWeight: 600, color: "var(--error)" }}>분석 오류</p>
            <p style={{ fontSize: 11, marginTop: 2, color: "var(--muted)" }}>{errorMsg}</p>
          </div>
          <Button variant="ghost" size="sm" full onClick={onRun}>다시 시도</Button>
        </div>
      )}

      {state === "done" && (
        <div>
          <div style={{ display: "flex", gap: 8, padding: "12px 16px 8px" }}>
            <Button variant="program" color={color} full size="sm" icon={<I.Download size={16} />} onClick={onDownload}>Word 다운로드</Button>
            <Button variant="ghost" size="sm" onClick={onReset}>재분석</Button>
          </div>
          <MarkdownView md={result} style={{ padding: "8px 16px 8px", fontSize: 13, color: "var(--text-secondary)", maxHeight: 360, overflowY: "auto" }} />

          {showNote && (
            <div style={{ padding: "12px 16px 16px", borderTop: "1px solid var(--border-light)" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
                <span style={{ fontSize: 11, fontWeight: 700, color }}>추가 분석 자료로 계획 보완 (선택)</span>
                {(note.trim() || (files && files.length > 0)) && (
                  <button onClick={() => { setNote(""); setFiles([]); }}
                    style={{ fontSize: 10, padding: "2px 8px", borderRadius: 8, border: "none", cursor: "pointer", background: "var(--surface-active)", color: "var(--muted)" }}>지우기</button>
                )}
              </div>
              <p style={{ fontSize: 11, color: "var(--muted)", marginBottom: 10, lineHeight: 1.6 }}>분석 결과를 검토한 뒤 면담 기록·상담 일지 등 추가 메모를 더해 계획을 보완 분석할 수 있습니다. (메모 내용이 재분석에 반영됩니다)</p>

              <div style={{ display: "flex", gap: 4, padding: 3, marginBottom: 10, borderRadius: 999, background: "var(--surface-active)" }}>
                {[["text", "글 작성"], ["file", "파일 첨부"]].map(([k, lbl]) => (
                  <button key={k} onClick={() => setNoteTab(k)}
                    style={{ flex: 1, padding: "6px 10px", borderRadius: 999, border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 11, fontWeight: 600,
                      background: noteTab === k ? "var(--surface)" : "transparent", color: noteTab === k ? color : "var(--text-secondary)",
                      boxShadow: noteTab === k ? "var(--shadow-card)" : "none", transition: "all var(--dur) var(--ease)" }}>{lbl}</button>
                ))}
              </div>

              {noteTab === "text" ? (
                <textarea value={note} onChange={e => setNote(e.target.value)} rows={3}
                  placeholder="참여자 면담 중 확인한 특이사항, 가족·건강 상황, 담당자 의견 등을 적으면 보완 계획에 반영됩니다."
                  style={{ width: "100%", padding: "10px 12px", borderRadius: 11, fontSize: 12, fontFamily: "inherit", outline: "none", resize: "none",
                    background: "var(--surface)", border: "1px solid var(--border)", color: "var(--text)", lineHeight: 1.6 }} />
              ) : (
                <label style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6, padding: "18px 12px", borderRadius: 11, cursor: "pointer",
                  background: "var(--surface)", border: "1.5px dashed " + color + "66", textAlign: "center" }}>
                  <input type="file" multiple onChange={addFiles} style={{ display: "none" }} />
                  <span style={{ color }}><I.Upload size={22} /></span>
                  <span style={{ fontSize: 12, fontWeight: 600, color: "var(--text)" }}>파일 선택 (파일명이 참고 자료로 기록됩니다)</span>
                  <span style={{ fontSize: 10, color: "var(--muted)" }}>면담 기록, 상담 일지, 자격증 사본 등</span>
                </label>
              )}

              {files && files.length > 0 && (
                <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 10 }}>
                  {files.map((f, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 10px", borderRadius: 9, background: "var(--surface)", border: "1px solid var(--border)" }}>
                      <span style={{ color, flex: "0 0 auto" }}><I.Doc size={14} /></span>
                      <span style={{ flex: 1, minWidth: 0, fontSize: 11, color: "var(--text)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{f.name}</span>
                      <span style={{ fontSize: 10, color: "var(--muted)", flex: "0 0 auto" }}>{fmtSize(f.size)}</span>
                      <button onClick={() => setFiles(files.filter((_, j) => j !== i))}
                        style={{ fontSize: 13, lineHeight: 1, padding: "0 2px", border: "none", cursor: "pointer", background: "transparent", color: "var(--muted)", flex: "0 0 auto" }}>×</button>
                    </div>
                  ))}
                </div>
              )}

              {(note.trim() || (files && files.length > 0)) && (
                <div style={{ marginTop: 12 }}>
                  <Button variant="program" color={color} full icon={<I.Analysis size={18} />} onClick={onRun}>추가 자료로 보완 분석</Button>
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── 참여자 상세 & 분석 ──
function ParticipantDetail({ response, onBack, gasUrl, geminiKey, claudeKey }) {
  const [oneulState, setOneulState] = useState("idle");
  const [oneulResult, setOneulResult] = useState("");
  const [oneulProgress, setOneulProgress] = useState(0);
  const [oneulError, setOneulError] = useState("");

  const [selectedPath, setSelectedPath] = useState("");
  const [customPath, setCustomPath] = useState("");

  const [naeirState, setNaeirState] = useState("idle");
  const [naeirResult, setNaeirResult] = useState("");
  const [naeirProgress, setNaeirProgress] = useState(0);
  const [naeirError, setNaeirError] = useState("");

  const [naeirNote, setNaeirNote] = useState("");
  const [naeirFiles, setNaeirFiles] = useState([]);

  const resolvedPath = selectedPath === "custom" ? customPath.trim() : selectedPath;

  const formatResponseData = () => {
    let text = `참여자 코드번호: ${response.code}\n소속: ${response.org}\n설문 응답일: ${response.timestamp}\n\n`;
    Object.entries(response.answers).forEach(([q, a]) => {
      const label = QUESTION_MAP[parseInt(q)] || `질문 ${q}`;
      text += `${label}\n→ ${a}\n\n`;
    });
    return text;
  };

  const getDemoResponse = (type) => type === "oneul" ? DEMO_ONEUL : DEMO_NAEIRO;

  // Google Gemini (오늘은)
  const callGemini = async (systemPrompt, userMessage) => {
    if (!geminiKey) return new Promise(resolve => setTimeout(() => resolve(getDemoResponse("oneul")), 2500));
    const res = await fetch(`${CONFIG.GEMINI_API_URL}?key=${geminiKey}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: "user", parts: [{ text: userMessage }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 8192 },
      }),
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error?.message || `Gemini API 오류 (${res.status})`);
    }
    const data = await res.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!text) throw new Error("Gemini API에서 응답을 받지 못했습니다");
    return text;
  };

  // Claude (내일로)
  const callClaude = async (systemPrompt, userMessage) => {
    if (!claudeKey) return new Promise(resolve => setTimeout(() => resolve(getDemoResponse("naeir")), 2500));
    const res = await fetch(CONFIG.CLAUDE_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": claudeKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: CONFIG.CLAUDE_MODEL, max_tokens: 8192, system: systemPrompt, messages: [{ role: "user", content: userMessage }] }),
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error?.message || `Claude API 오류 (${res.status})`);
    }
    const data = await res.json();
    const text = data.content?.[0]?.text;
    if (!text) throw new Error("Claude API에서 응답을 받지 못했습니다");
    return text;
  };

  const runOneul = async () => {
    setOneulState("analyzing"); setOneulProgress(0); setOneulError("");
    try {
      const responseData = formatResponseData();
      const timer = setInterval(() => setOneulProgress(p => Math.min(p + 5, 90)), 500);
      const result = await callGemini(ONEUL_PROMPT, `다음 참여자 데이터를 분석해 주십시오.\n\n${responseData}\n\n오늘은 분석해줘`);
      clearInterval(timer);
      setOneulProgress(100); setOneulResult(result); setOneulState("done");
    } catch (err) {
      setOneulState("error"); setOneulError(err.message);
    }
  };

  const runNaeir = async () => {
    setNaeirState("analyzing"); setNaeirProgress(0); setNaeirError("");
    try {
      const pathText = resolvedPath;
      // 추가 자료 메모/파일명을 보완 컨텍스트로 구성
      const extras = [];
      if (naeirNote.trim()) extras.push(`담당자 추가 메모: ${naeirNote.trim()}`);
      if (naeirFiles.length) extras.push(`첨부 참고 자료(파일명): ${naeirFiles.map(f => f.name).join(", ")}`);
      const extraBlock = extras.length ? `\n\n=== 추가 반영 자료 ===\n${extras.join("\n")}` : "";

      let inputData;
      if (oneulResult) {
        inputData = `=== 심층 분석 리포트 내용 ===\n${oneulResult}\n\n=== 확정된 자활 경로 ===\n${pathText ? `담당자가 선택한 자활 경로: '${pathText}'\n이 경로에 맞춰 3년 로드맵과 실행 계획을 설계하십시오.` : "(오늘은 분석에서 도출된 IAP 내용 기반)"}${extraBlock}\n\n위 내용을 바탕으로 내일로 분석해줘`;
      } else {
        const responseData = formatResponseData();
        inputData = `다음 참여자 데이터를 바탕으로 실행 계획을 설계해 주십시오.\n\n${responseData}\n\n${pathText ? `담당자가 선택한 자활 경로: '${pathText}'\n이 경로에 맞춰 설계하십시오.\n\n` : ""}${extraBlock}\n\n내일로 분석해줘`;
      }
      const timer = setInterval(() => setNaeirProgress(p => Math.min(p + 5, 90)), 500);
      const result = await callClaude(NAEIRO_PROMPT, inputData);
      clearInterval(timer);
      setNaeirProgress(100); setNaeirResult(result); setNaeirState("done");
    } catch (err) {
      setNaeirState("error"); setNaeirError(err.message);
    }
  };

  const downloadAsWord = (markdown, filename) => {
    const htmlContent = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
      <head><meta charset="utf-8"><style>
        body { font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; font-size: 11pt; line-height: 1.8; color: #1a1a1a; }
        h1 { font-size: 18pt; color: #1a365d; border-bottom: 2px solid #2b6cb0; padding-bottom: 8pt; margin-top: 20pt; }
        h2 { font-size: 14pt; color: #2c5282; border-bottom: 1px solid #bee3f8; padding-bottom: 6pt; margin-top: 16pt; }
        h3 { font-size: 12pt; color: #2d3748; margin-top: 12pt; }
        blockquote { border-left: 3px solid #4299e1; padding-left: 12pt; color: #4a5568; font-style: italic; margin: 8pt 0; }
        hr { border: none; border-top: 1px solid #e2e8f0; margin: 16pt 0; }
      </style></head>
      <body>${renderMarkdown(markdown)}</body></html>`;
    const blob = new Blob(["﻿", htmlContent], { type: "application/msword" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${filename}_${new Date().toISOString().split("T")[0]}.doc`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const downloadOneulWord = () => {
    const report = `# 프로젝트 내일로 - 심층 DNA 분석 리포트\n\n참여자: ${response.code}\n소속: ${response.org}\n분석일: ${new Date().toLocaleDateString("ko-KR")}\n\n---\n\n${oneulResult}\n\n---\n\n> 충북청주지역자활센터 프로젝트 내일로 ${CONFIG.APP_VERSION}\n> 오늘은 프롬프트: 심층 심리 및 서사 분석`;
    downloadAsWord(report, `오늘은_분석_${response.code}`);
  };

  const downloadNaeirWord = () => {
    const report = `# 프로젝트 내일로 - 실행 계획 설계 리포트\n\n참여자: ${response.code}\n소속: ${response.org}\n분석일: ${new Date().toLocaleDateString("ko-KR")}\n\n---\n\n${naeirResult}\n\n---\n\n> 충북청주지역자활센터 프로젝트 내일로 ${CONFIG.APP_VERSION}\n> 내일로 프롬프트: 구체적 실행 계획 수립`;
    downloadAsWord(report, `내일로_분석_${response.code}`);
  };

  const bothDone = oneulState === "done" && naeirState === "done";

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
        <button onClick={onBack} style={{ padding: 8, borderRadius: 13, border: "none", background: "transparent", cursor: "pointer", color: "var(--text-secondary)" }}><I.Back size={18} /></button>
        <div style={{ flex: 1, minWidth: 0 }}>
          <h2 style={{ fontSize: 18, fontWeight: 700, color: "var(--heading)" }}>{response.code}</h2>
          <p style={{ fontSize: 12, color: "var(--muted)" }}>{response.org} · {response.timestamp}</p>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          {oneulState === "done" && <Badge tone="oneul">오늘은</Badge>}
          {naeirState === "done" && <Badge tone="naeiro">내일로</Badge>}
        </div>
      </div>

      <details style={{ borderRadius: 16, marginBottom: 16, background: "var(--surface)", border: "1px solid var(--border)", boxShadow: "var(--shadow-card)" }}>
        <summary style={{ padding: "12px 16px", fontSize: 14, fontWeight: 600, cursor: "pointer", color: "var(--text-secondary)", listStyle: "none" }}>설문 응답 요약 (17문항)</summary>
        <div style={{ padding: "0 16px 12px", display: "flex", flexDirection: "column", gap: 8, maxHeight: 200, overflowY: "auto" }}>
          {Object.entries(response.answers).map(([q, a]) => (
            <div key={q} style={{ fontSize: 12 }}>
              <span style={{ color: "var(--accent)" }}>{QUESTION_MAP[parseInt(q)]?.split(".")[0]}.</span>{" "}
              <span style={{ color: "var(--text-secondary)" }}>{a.length > 60 ? a.slice(0, 60) + "..." : a}</span>
            </div>
          ))}
        </div>
      </details>

      {bothDone && (
        <DownloadCenter response={response} oneulResult={oneulResult} naeirResult={naeirResult}
          selectedPath={resolvedPath} gasUrl={gasUrl} downloadAsWord={downloadAsWord} />
      )}

      <div style={{ marginBottom: 12 }}>
        <AnalysisCard label="오늘은" subtitle="심층 DNA 분석" color="var(--oneul)" colorSoft="var(--oneul-soft)"
          desc="참여자의 심리 성향, 인생 서사, SWOT 진단, IAP 계획을 분석합니다."
          result={oneulResult} state={oneulState} progress={oneulProgress} errorMsg={oneulError}
          onRun={runOneul} onReset={() => { setOneulState("idle"); setOneulResult(""); setSelectedPath(""); setCustomPath(""); setNaeirNote(""); setNaeirFiles([]); }}
          onDownload={downloadOneulWord} />
      </div>

      {oneulState === "done" && naeirState !== "done" && (
        <div style={{ marginBottom: 12 }}>
          <PathSelect selected={selectedPath} setSelected={setSelectedPath} customText={customPath} setCustomText={setCustomPath} />
        </div>
      )}

      <div style={{ marginBottom: 12 }}>
        <AnalysisCard label="내일로" subtitle="실행 계획 설계" color="var(--naeiro)" colorSoft="var(--naeiro-soft)"
          desc="선택한 자활 경로와 추가 메모를 반영해 3년 자활 로드맵, 당월 실천 계획, 주간 모니터링 일지를 설계합니다."
          result={naeirResult} state={naeirState} progress={naeirProgress} errorMsg={naeirError}
          context={naeirState !== "idle" && resolvedPath ? resolvedPath : null}
          showNote note={naeirNote} setNote={setNaeirNote} files={naeirFiles} setFiles={setNaeirFiles}
          onRun={runNaeir} onReset={() => setNaeirState("idle")} onDownload={downloadNaeirWord} />
      </div>

      {oneulState === "done" && naeirState === "idle" && (
        <div style={{ display: "flex", alignItems: "flex-start", gap: 8, borderRadius: 13, padding: 12,
          background: resolvedPath ? "rgba(46,158,120,.06)" : "var(--accent-soft)", border: `1px solid ${resolvedPath ? "rgba(46,158,120,.18)" : "var(--accent-border)"}` }}>
          <span style={{ fontSize: 13 }}>{resolvedPath ? "✅" : "☝️"}</span>
          <p style={{ fontSize: 12, color: resolvedPath ? "var(--naeiro)" : "var(--accent)" }}>
            {resolvedPath ? `'${resolvedPath}' 경로가 선택되었습니다. 내일로 분석 시작 버튼을 눌러주세요.`
                          : "오늘은 분석이 완료되었습니다. 위에서 자활 경로를 선택한 후 내일로 분석을 실행하세요."}
          </p>
        </div>
      )}
    </div>
  );
}

// ── 설정 모달 ──
function SettingsModal({ show, onClose, gasUrl, setGasUrl, geminiKey, setGeminiKey, claudeKey, setClaudeKey }) {
  const [tempUrl, setTempUrl] = useState(gasUrl);
  const [tempGeminiKey, setTempGeminiKey] = useState(geminiKey);
  const [tempClaudeKey, setTempClaudeKey] = useState(claudeKey);
  const [showGeminiKey, setShowGeminiKey] = useState(false);
  const [showClaudeKey, setShowClaudeKey] = useState(false);

  useEffect(() => {
    if (show) { setTempUrl(gasUrl); setTempGeminiKey(geminiKey); setTempClaudeKey(claudeKey); }
  }, [show]);

  if (!show) return null;

  const ApiKeyField = ({ label, color, icon, value, onChange, showKey, toggleShow, placeholder, description }) => (
    <div style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
        <span style={{ width: 8, height: 8, borderRadius: 999, background: color }} />
        <label style={{ fontSize: 12, fontWeight: 500, color: "var(--text-secondary)" }}>{label}</label>
        <span style={{ fontSize: 10, padding: "2px 6px", borderRadius: 4, background: color + "1A", color }}>{icon}</span>
      </div>
      <div style={{ position: "relative" }}>
        <input type={showKey ? "text" : "password"} value={value} onChange={onChange} placeholder={placeholder}
          style={{ width: "100%", padding: "9px 56px 9px 12px", borderRadius: 13, fontSize: 12, fontFamily: "inherit", outline: "none", background: "var(--bg)", border: `1px solid ${value ? color + "55" : "var(--border)"}`, color: "var(--text)" }} />
        <button onClick={toggleShow}
          style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", fontSize: 10, padding: "2px 8px", borderRadius: 6, border: "none", cursor: "pointer", color: "var(--muted)", background: "var(--surface-active)" }}>
          {showKey ? "숨기기" : "보기"}
        </button>
      </div>
      <p style={{ fontSize: 10, marginTop: 4, color: "var(--muted)" }}>{description}</p>
    </div>
  );

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: 16, background: "var(--scrim)" }}>
      <div onClick={e => e.stopPropagation()} style={{ width: "100%", maxWidth: 440, maxHeight: "90vh", overflowY: "auto", borderRadius: 20, background: "var(--surface)", border: "1px solid var(--border)", boxShadow: "var(--shadow-modal)" }}>
        <div style={{ padding: "20px 24px 12px" }}>
          <h3 style={{ fontSize: 16, fontWeight: 700, color: "var(--heading)" }}>시스템 설정</h3>
          <p style={{ fontSize: 10, marginTop: 4, color: "var(--muted)" }}>각 분석 엔진의 API Key를 설정합니다</p>
        </div>
        <div style={{ padding: "0 24px 8px" }}>
          <div style={{ borderRadius: 16, padding: 12, marginBottom: 14, background: "var(--bg)", border: "1px solid var(--border-light)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}><span>🔮</span><span style={{ fontSize: 10, fontWeight: 700, color: "var(--text-secondary)" }}>AI 분석 엔진 구성</span></div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 10 }}><span style={{ width: 6, height: 6, borderRadius: 999, background: "var(--oneul)" }} /><span style={{ color: "var(--oneul)" }}>오늘은</span><span style={{ color: "var(--muted)" }}>심층 DNA 분석</span><span style={{ marginLeft: "auto", padding: "2px 6px", borderRadius: 4, background: "rgba(123,102,214,.1)", color: "var(--oneul)" }}>Google Gemini</span></div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 10 }}><span style={{ width: 6, height: 6, borderRadius: 999, background: "var(--naeiro)" }} /><span style={{ color: "var(--naeiro)" }}>내일로</span><span style={{ color: "var(--muted)" }}>실행 계획 설계</span><span style={{ marginLeft: "auto", padding: "2px 6px", borderRadius: 4, background: "rgba(46,158,120,.1)", color: "var(--naeiro)" }}>Claude AI</span></div>
            </div>
          </div>

          <ApiKeyField label="Google Gemini API Key" color="var(--oneul)" icon="오늘은"
            value={tempGeminiKey} onChange={e => setTempGeminiKey(e.target.value)} showKey={showGeminiKey} toggleShow={() => setShowGeminiKey(!showGeminiKey)}
            placeholder="AIzaSy..." description="오늘은 분석에 사용 · Google AI Studio에서 발급" />

          <ApiKeyField label="Claude API Key" color="var(--naeiro)" icon="내일로"
            value={tempClaudeKey} onChange={e => setTempClaudeKey(e.target.value)} showKey={showClaudeKey} toggleShow={() => setShowClaudeKey(!showClaudeKey)}
            placeholder="sk-ant-..." description="내일로 분석에 사용 · Anthropic Console에서 발급" />

          <div style={{ marginBottom: 16 }}>
            <label style={{ display: "block", fontSize: 12, fontWeight: 500, marginBottom: 6, color: "var(--text-secondary)" }}>GAS 프록시 URL</label>
            <input value={tempUrl} onChange={e => setTempUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec"
              style={{ width: "100%", padding: "9px 12px", borderRadius: 13, fontSize: 12, fontFamily: "inherit", outline: "none", background: "var(--bg)", border: "1px solid var(--border)", color: "var(--text)" }} />
            <p style={{ fontSize: 10, marginTop: 4, color: "var(--muted)" }}>설문 응답 조회 및 문서 생성에 사용</p>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, fontSize: 10, color: "var(--muted)" }}>
            <span>{tempGeminiKey ? "🟢" : "🔴"} Gemini</span>
            <span>{tempClaudeKey ? "🟢" : "🔴"} Claude</span>
            <span>{tempUrl ? "🟢" : "🔴"} GAS</span>
            <span style={{ marginLeft: "auto" }}>미설정 항목은 데모 모드</span>
          </div>
        </div>
        <div style={{ padding: "0 24px 20px", display: "flex", gap: 8, justifyContent: "flex-end" }}>
          <Button variant="ghost" size="sm" onClick={onClose} style={{ border: "none", background: "transparent" }}>취소</Button>
          <Button variant="primary" size="sm" onClick={() => {
            setGasUrl(tempUrl); setGeminiKey(tempGeminiKey); setClaudeKey(tempClaudeKey);
            localStorage.setItem("naeilro_gas_url", tempUrl);
            localStorage.setItem("naeilro_gemini_key", tempGeminiKey);
            localStorage.setItem("naeilro_claude_key", tempClaudeKey);
            onClose();
          }}>저장</Button>
        </div>
      </div>
    </div>
  );
}

// ── 메인 앱 ──
function App() {
  const [user, setUser] = useState(null);
  const [responses, setResponses] = useState([]);
  const [selectedResponse, setSelectedResponse] = useState(null);
  const [searchTerm, setSearchTerm] = useState("");
  const [showSettings, setShowSettings] = useState(false);
  const [view, setView] = useState("list");
  const [gasUrl, setGasUrl] = useState(() => localStorage.getItem("naeilro_gas_url") ?? CONFIG.GAS_PROXY_URL);
  const [geminiKey, setGeminiKey] = useState(() => localStorage.getItem("naeilro_gemini_key") || "");
  const [claudeKey, setClaudeKey] = useState(() => localStorage.getItem("naeilro_claude_key") || "");
  const [loading, setLoading] = useState(false);
  const [loadError, setLoadError] = useState("");

  const fetchResponses = async (url) => {
    setLoading(true); setLoadError("");
    try {
      const res = await fetch(url + "?action=responses");
      const data = await res.json();
      if (data.success && data.responses) {
        setResponses(data.responses);
      } else {
        setLoadError(data.error || "응답을 불러올 수 없습니다");
        setResponses(DEMO_RESPONSES);
      }
    } catch (err) {
      setLoadError("서버 연결 실패: " + err.message);
      setResponses(DEMO_RESPONSES);
    }
    setLoading(false);
  };

  const handleLogin = (userData) => {
    setUser(userData);
    if (gasUrl) fetchResponses(gasUrl);
    else setResponses(DEMO_RESPONSES);
  };

  useEffect(() => {
    if (user && gasUrl) fetchResponses(gasUrl);
    if (user && !gasUrl) setResponses(DEMO_RESPONSES);
  }, [gasUrl]);

  if (!user) return <LoginScreen onLogin={handleLogin} />;

  const demoFlags = { gemini: !geminiKey, claude: !claudeKey, gas: !gasUrl };
  const anyDemo = demoFlags.gemini || demoFlags.claude || demoFlags.gas;

  return (
    <div style={{ minHeight: "100vh", background: "var(--bg)" }}>
      <div style={{ maxWidth: 540, margin: "0 auto", minHeight: "100vh", display: "flex", flexDirection: "column", background: "var(--bg)" }}>
        <header style={{ position: "sticky", top: 0, zIndex: 40, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between",
          background: "var(--blur-bg)", backdropFilter: "blur(12px)", WebkitBackdropFilter: "blur(12px)", borderBottom: "1px solid var(--border-light)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ color: "var(--accent)" }}><I.Logo size={30} /></span>
            <div>
              <h1 style={{ fontSize: 14, fontWeight: 700, color: "var(--heading)" }}>프로젝트 내일로</h1>
              <p style={{ fontSize: 10, color: "var(--muted)" }}>AI 참여자 분석 시스템</p>
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <button onClick={() => setShowSettings(true)} style={{ padding: 8, borderRadius: 13, border: "none", background: "transparent", cursor: "pointer", fontSize: 14, color: "var(--muted)" }}>⚙</button>
            <button onClick={() => { setUser(null); setSelectedResponse(null); }} style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 12px", borderRadius: 13, border: "none", background: "transparent", cursor: "pointer", fontSize: 12, color: "var(--muted)", fontFamily: "inherit" }}>
              <I.Logout size={16} /><span>{user.name}</span>
            </button>
          </div>
        </header>

        <main style={{ flex: 1, padding: 16 }}>
          {anyDemo && (
            <div style={{ display: "flex", alignItems: "flex-start", gap: 8, borderRadius: 16, padding: 12, marginBottom: 16, background: "rgba(200,137,58,.07)", border: "1px solid rgba(200,137,58,.2)" }}>
              <span style={{ fontSize: 14 }}>⚡</span>
              <div>
                <p style={{ fontSize: 12, fontWeight: 600, color: "var(--warning)" }}>{demoFlags.gemini && demoFlags.claude && demoFlags.gas ? "데모 모드" : "일부 데모 모드"}</p>
                <div style={{ fontSize: 12, marginTop: 2, color: "var(--muted)" }}>
                  {demoFlags.gemini && <div>🔴 Gemini API Key 미설정 → 오늘은 분석이 데모로 동작</div>}
                  {demoFlags.claude && <div>🔴 Claude API Key 미설정 → 내일로 분석이 데모로 동작</div>}
                  {demoFlags.gas && <div>🔴 GAS URL 미설정 → 샘플 데이터로 동작</div>}
                  <div style={{ marginTop: 4 }}>설정(⚙)에서 API Key를 입력하세요.</div>
                </div>
              </div>
            </div>
          )}

          {loading && (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "32px 0" }}>
              <span style={{ color: "var(--accent)" }}><I.Spinner size={20} /></span>
              <span style={{ fontSize: 14, color: "var(--text-secondary)" }}>설문 응답을 불러오는 중...</span>
            </div>
          )}

          {loadError && !loading && (
            <div style={{ display: "flex", alignItems: "flex-start", gap: 8, borderRadius: 16, padding: 12, marginBottom: 16, background: "rgba(214,106,92,.07)", border: "1px solid rgba(214,106,92,.2)" }}>
              <span style={{ fontSize: 14 }}>⚠️</span>
              <div style={{ flex: 1 }}>
                <p style={{ fontSize: 12, fontWeight: 600, color: "var(--error)" }}>데이터 로딩 실패</p>
                <p style={{ fontSize: 12, marginTop: 2, color: "var(--muted)" }}>{loadError}</p>
                <p style={{ fontSize: 12, marginTop: 2, color: "var(--muted)" }}>샘플 데이터로 표시합니다.</p>
              </div>
              <button onClick={() => fetchResponses(gasUrl)} style={{ fontSize: 11, padding: "4px 10px", borderRadius: 10, cursor: "pointer", fontFamily: "inherit", background: "var(--surface-hover)", color: "var(--text-secondary)", border: "1px solid var(--border)" }}>재시도</button>
            </div>
          )}

          {!loading && (selectedResponse ? (
            <ParticipantDetail response={selectedResponse} onBack={() => setSelectedResponse(null)}
              gasUrl={gasUrl} geminiKey={geminiKey} claudeKey={claudeKey} />
          ) : (
            <>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
                <div style={{ display: "flex", gap: 4, padding: 4, borderRadius: 999, background: "var(--surface-active)", width: "fit-content" }}>
                  {[["list", "참여자"], ["dash", "현황"]].map(([k, lbl]) => (
                    <button key={k} onClick={() => setView(k)}
                      style={{ padding: "7px 18px", borderRadius: 999, border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 13, fontWeight: 600,
                        background: view === k ? "var(--surface)" : "transparent", color: view === k ? "var(--accent)" : "var(--text-secondary)",
                        boxShadow: view === k ? "var(--shadow-card)" : "none", transition: "all var(--dur) var(--ease)" }}>{lbl}</button>
                  ))}
                </div>
                {gasUrl && !loadError && (
                  <button onClick={() => fetchResponses(gasUrl)} style={{ fontSize: 11, padding: "6px 10px", borderRadius: 10, cursor: "pointer", fontFamily: "inherit", background: "transparent", border: "none", color: "var(--muted)" }}>🔄 새로고침</button>
                )}
              </div>
              {view === "list"
                ? <ResponseList responses={responses} onSelect={setSelectedResponse} searchTerm={searchTerm} setSearchTerm={setSearchTerm} />
                : <DashboardScreen responses={responses} />}
            </>
          ))}
        </main>

        <footer style={{ padding: 16, textAlign: "center" }}>
          <p style={{ fontSize: 10, color: "var(--muted)" }}>충북청주지역자활센터 · 프로젝트 내일로 {CONFIG.APP_VERSION}</p>
        </footer>
      </div>

      <SettingsModal show={showSettings} onClose={() => setShowSettings(false)}
        gasUrl={gasUrl} setGasUrl={setGasUrl} geminiKey={geminiKey} setGeminiKey={setGeminiKey} claudeKey={claudeKey} setClaudeKey={setClaudeKey} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
